<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reimposta Password | Mimmo Fratelli</title>
    <link rel="icon" type="image/png" sizes="32x32" href="Images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="Images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="Images/apple-touch-icon.png">
    <link rel="shortcut icon" href="favicon.ico">
    <meta name="theme-color" content="#f8fdf5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .reset-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background: linear-gradient(135deg, #f8fdf5 0%, #e8f5e0 50%, #f0f9eb 100%);
        }

        .reset-card {
            text-align: center;
            max-width: 440px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 3rem 2rem;
            border-radius: 24px;
            box-shadow:
                0 4px 24px rgba(31, 45, 31, 0.08),
                0 12px 48px rgba(31, 45, 31, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .reset-icon {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            display: block;
        }

        .reset-title {
            font-family: var(--font-display);
            font-size: 1.8rem;
            color: var(--color-primary, #1f2d1f);
            margin-bottom: 0.5rem;
        }

        .reset-subtitle {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .reset-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .reset-form input {
            width: 100%;
            padding: 0.9rem 1rem;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }

        .reset-form input:focus {
            outline: none;
            border-color: var(--color-accent, #3d7c47);
            box-shadow: 0 0 0 3px rgba(61, 124, 71, 0.1);
        }

        .reset-btn {
            width: 100%;
            padding: 0.9rem;
            background: var(--color-accent, #3d7c47);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            font-family: inherit;
        }

        .reset-btn:hover {
            opacity: 0.9;
        }

        .reset-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .reset-message {
            padding: 0.8rem 1rem;
            border-radius: 10px;
            font-size: 0.9rem;
            display: none;
            margin-top: 0.5rem;
        }

        .reset-message.success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
            display: block;
        }

        .reset-message.error {
            background: #fce4ec;
            color: #c62828;
            border: 1px solid #f8bbd0;
            display: block;
        }

        .reset-back {
            display: inline-block;
            margin-top: 1.5rem;
            color: var(--color-accent, #3d7c47);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .reset-back:hover {
            text-decoration: underline;
        }

        .password-requirements {
            text-align: left;
            font-size: 0.8rem;
            color: #888;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>
    <main class="reset-page">
        <div class="reset-card">
            <span class="reset-icon">🔐</span>
            <h1 class="reset-title">Nuova Password</h1>
            <p class="reset-subtitle">Inserisci la tua nuova password per reimpostare l'accesso al tuo account.</p>

            <form class="reset-form" id="resetForm">
                <input type="password" id="newPassword" placeholder="Nuova password" required minlength="8" autocomplete="new-password">
                <input type="password" id="confirmPassword" placeholder="Conferma password" required minlength="8" autocomplete="new-password">
                <p class="password-requirements">Minimo 8 caratteri</p>
                <button type="submit" class="reset-btn" id="resetBtn">Reimposta Password</button>
            </form>

            <div class="reset-message" id="resetMessage"></div>

            <a href="index.html" class="reset-back">← Torna alla Home</a>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script type="module">
        import { supabase, isSupabaseConfigured } from './js/supabase.js';

        const form = document.getElementById('resetForm');
        const messageEl = document.getElementById('resetMessage');
        const resetBtn = document.getElementById('resetBtn');

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = 'reset-message ' + type;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword.length < 8) {
                showMessage('La password deve essere di almeno 8 caratteri.', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage('Le password non coincidono.', 'error');
                return;
            }

            if (!isSupabaseConfigured()) {
                showMessage('Sistema non configurato. Riprova più tardi.', 'error');
                return;
            }

            resetBtn.disabled = true;
            resetBtn.textContent = 'Aggiornamento...';

            try {
                const { error } = await supabase.auth.updateUser({
                    password: newPassword
                });

                if (error) {
                    showMessage(error.message || 'Errore durante il reset della password.', 'error');
                    resetBtn.disabled = false;
                    resetBtn.textContent = 'Reimposta Password';
                    return;
                }

                showMessage('Password aggiornata con successo! Verrai reindirizzato...', 'success');
                form.style.display = 'none';

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2500);
            } catch (err) {
                showMessage('Si è verificato un errore. Riprova.', 'error');
                resetBtn.disabled = false;
                resetBtn.textContent = 'Reimposta Password';
            }
        });
    </script>
</body>
</html>
